<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>G-Micro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="titlebar">
  <button id="history-trigger" class="chrome-btn" title="Rozmowy (⌘K)" aria-label="Rozmowy">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
  <div class="brand">
    <span>G-Micro</span>
  </div>
  <button id="new-trigger" class="chrome-btn" title="Nowa rozmowa (⌘N)" aria-label="Nowa rozmowa">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
</div>

<div id="sidebar-scrim"></div>
<aside id="sidebar" aria-hidden="true">
  <div id="sidebar-header">
    <span class="title">Rozmowy</span>
    <button id="sidebar-new" title="Nowa rozmowa (⌘N)" aria-label="Nowa rozmowa">
      <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div id="sidebar-list"></div>
</aside>

<main id="shell">
  <section id="conversation-pane">
    <div id="messages">
      <!-- Shown only while the conversation is empty. A blank screen with a
           blinking cursor asks the reader to already know what to type; the
           suggestions answer that question by example, and every one of them
           is something this model is measurably good at. -->
      <div id="welcome">
        <h1>Cześć, jestem G-Micro.</h1>
        <p>Mały model językowy, który mówi po polsku. Zapytaj mnie o coś.</p>
        <div id="suggestions">
          <button class="suggestion" data-text="Kim jesteś?">Kim jesteś?</button>
          <button class="suggestion" data-text="Wymień trzy owoce.">Wymień trzy owoce.</button>
          <button class="suggestion" data-text="Czym jest Warszawa?">Czym jest Warszawa?</button>
          <button class="suggestion" data-text="Opowiedz coś o psach.">Opowiedz coś o psach.</button>
        </div>
      </div>
    </div>
    <div id="input-composer">
      <div id="input-bar">
        <textarea id="input-field" rows="1" placeholder="Napisz wiadomość…" spellcheck="false"></textarea>
        <button id="send-btn" class="disabled" aria-label="Wyślij">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="composer-hint">G-Micro jest bardzo małym modelem i często się myli.</div>
    </div>
  </section>

  <!-- The instrument panel this app was originally built around. Hidden by
       default so the everyday experience is just a chat; ⌥⌘D brings it back.
       Kept rather than deleted — it is the part that shows what the model is
       actually doing, which was half the point of building G-Micro. -->
  <section id="panel-pane">
    <nav id="tabs" role="tablist">
      <button class="tab" data-tab="neurons" role="tab" aria-selected="true">
        Neurons<span class="indicator"></span>
      </button>
      <button class="tab" data-tab="probabilities" role="tab" aria-selected="false">
        Probabilities<span class="indicator" style="opacity:0"></span>
      </button>
      <!-- Parameter count and throughput live here rather than in the title
           bar: real numbers, but jargon, and the chat view is meant to read
           like a chat rather than a dashboard. -->
      <div class="panel-readout mono">
        <b id="brand-params">—</b><span id="brand-speed"></span>
      </div>
    </nav>
    <div class="panel-body">
      <div id="neurons-view" class="panel-view active">
        <div id="neurons-wrap">
          <canvas id="neurons-canvas"></canvas>
          <div id="neuron-tooltip"></div>
          <div id="pinned-chart">
            <div class="label"><span id="pinned-label">—</span><span id="pinned-unpin" style="cursor:pointer">unpin ✕</span></div>
            <canvas id="pinned-canvas"></canvas>
          </div>
        </div>
      </div>
      <div id="probabilities-view" class="panel-view">
        <div id="prob-bars"></div>
        <div id="confidence">
          <div class="row">
            <span class="label">Confidence</span>
            <span class="state mono" id="confidence-state">—</span>
          </div>
          <div class="track"><div class="fill" id="confidence-fill" style="width:0%"></div></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="wake-overlay">
  <canvas id="wake-canvas"></canvas>
  <div id="wake-label">Budzę model…</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
